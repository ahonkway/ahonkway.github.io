<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Membuka Dashboard…</title>
<style>
  :root { color-scheme: dark; }
  body {
    margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
    background: #0f1115; color: #e6e8ee;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
  }
  .kotak { text-align: center; padding: 28px 24px; max-width: 420px; }
  .spinner {
    width: 34px; height: 34px; margin: 0 auto 18px;
    border: 3px solid #2a2f3a; border-top-color: #4f8cff; border-radius: 50%;
    animation: putar .8s linear infinite;
  }
  @keyframes putar { to { transform: rotate(360deg); } }
  h1 { font-size: 17px; font-weight: 600; margin: 0 0 8px; }
  p { font-size: 13px; line-height: 1.6; color: #9aa3b2; margin: 0 0 6px; }
  a { color: #4f8cff; word-break: break-all; }
  .galat { color: #ff6b6b; }
  .kecil { font-size: 11px; color: #5f6878; margin-top: 18px; }
</style>
</head>
<body>
<div class="kotak">
  <div class="spinner" id="spinner"></div>
  <h1 id="judul">Membuka Dashboard…</h1>
  <p id="pesan">Mencari alamat terbaru.</p>
  <p id="tautan"></p>
  <p class="kecil" id="waktu"></p>
</div>

<script>
(function () {
  var judul = document.getElementById('judul');
  var pesan = document.getElementById('pesan');
  var tautan = document.getElementById('tautan');
  var waktu = document.getElementById('waktu');
  var spinner = document.getElementById('spinner');

  function gagal(teks) {
    spinner.style.display = 'none';
    judul.textContent = 'Dashboard tidak bisa dibuka';
    judul.className = 'galat';
    pesan.textContent = teks;
  }

  // Cache-buster: GitHub Pages menyimpan berkas di CDN, jadi tanpa ini
  // alamat lama bisa terus terpakai setelah diperbarui.
  fetch('url.json?t=' + Date.now(), { cache: 'no-store' })
    .then(function (r) {
      if (!r.ok) throw new Error('HTTP ' + r.status);
      return r.json();
    })
    .then(function (d) {
      if (!d || !d.url) throw new Error('alamat kosong');
      var tujuan = d.url.replace(/\/+$/, '') + '/?k=' + encodeURIComponent(d.token || '');
      pesan.textContent = 'Mengalihkan ke dashboard…';
      if (d.diperbarui) waktu.textContent = 'Alamat diperbarui: ' + d.diperbarui;
      tautan.innerHTML = '<a href="' + tujuan + '">' + tujuan + '</a>';
      // Beri jeda singkat supaya pesan terbaca, lalu pindah.
      setTimeout(function () { window.location.replace(tujuan); }, 600);
    })
    .catch(function (e) {
      gagal('Alamat dashboard belum tersedia (' + e.message + '). Coba muat ulang halaman ini.');
    });
})();
</script>
</body>
</html>
